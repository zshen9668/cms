# ============================================================================
# 白标 CMS —— 唯一的 Cloudflare Workers 配置文件
# ============================================================================
# 旧版本把配置拆成 wrangler.toml（第一阶段）和 wrangler.production.toml（第二阶段），
# 要求站长在 Cloudflare 控制台里手动切换 Deploy command。那套流程既容易割裂，
# 也是部署失败的来源之一。现在只有一个文件、一条命令：
#
#     npm run deploy
#
# 该命令会依次完成：读取 API Token → 幂等创建 D1/KV/R2 → 把资源 ID 写回本文件
# → 应用 migrations/ 下的全部 D1 迁移 → 发布 Worker → 跑 /healthz 自检。
#
# 下面的 database_id 与 CACHE_KV id 故意留空：首次执行 npm run deploy 时会自动填入。
# 资源 ID 不是密码，可以放在仓库里；但请不要把 API Token 写进本文件。
# 若你的 Cloudflare 账号里已经建好资源，也可以手动把 ID 填到对应位置。
# ============================================================================

name = "white-label-cms"
main = "src/index.ts"
# 不要填未来的日期。
# 旧配置写了 "2026-10-17"，比当时 Wrangler 内置 workerd 支持的最新日期（2026-09-28）还新，
# 结果是 `wrangler dev` 直接启动失败：Worker requires compatibility date 2026-10-17,
# but the newest date supported by this server binary is 2026-09-28。
# 这里取当前工具链确认支持的最大日期；升级 wrangler 后可以再往后调。
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

# settings 表由运行时后台写入，重新部署时不要用配置文件里的值覆盖已有设置
keep_vars = true

[build]
command = "npm run build"

# 静态资源：public/ 目录整体作为 ASSETS 绑定发布
[assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# D1 数据库：文章、城市、服务、关键词、设置等全部业务数据
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "white-label-cms-db"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV：会话密钥、缓存、登录限流计数
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE_KV"

# ---------------------------------------------------------------------------
# R2：媒体文件本体（D1 只存元数据）
# 未绑定 R2 时 /media/* 返回 503，其余站点功能不受影响。
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "white-label-cms-r2-media"

# ---------------------------------------------------------------------------
# Workers AI：AI 内容生成。账号未开通时 /healthz 会标记为未绑定，但不影响站点运行。
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# 新闻采集定时任务
[triggers]
crons = ["*/5 * * * *"]
